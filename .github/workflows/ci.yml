name: Protocol-0 SRE Control Plane CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    name: Core Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Core Dependencies
      run: npm ci

    - name: TypeScript Type Check
      run: npx tsc --noEmit

    - name: Compile TypeScript to JavaScript (`dist/`)
      run: npm run build

    - name: Execute Full Suite Unit Tests (Native Node.js Test Runner)
      run: npm test

  build-widgets:
    name: Next.js + TanStack Table Interactive Widgets Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: src/widgets/package-lock.json

    - name: Install Widget Dependencies
      run: cd src/widgets && npm ci

    - name: Static Export Build (`src/widgets/out/`)
      run: cd src/widgets && npm run build

  docker-verify:
    name: Multi-Stage Container Build Verification
    runs-on: ubuntu-latest
    needs: [test-backend, build-widgets]
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Production Container Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: protocol-0-sre-control-plane:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
